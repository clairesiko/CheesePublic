<div class="container">
    <h1>Les fromages de France de A à Z</h1>

<script src="data.js"></script>
<script>
(function(){
    var raw=JSON.parse(atob(CHEESE_DATA_B64));
    var cheeses=raw.cheeses||raw;
    cheeses.sort(function(a,b){return (a.nm||'').localeCompare(b.nm||'','fr');});

    var byLetter={};
    cheeses.forEach(function(c){
        var first=(c.nm||'?')[0].toUpperCase();
        if(first<'A'||first>'Z')first='#';
        if(!byLetter[first])byLetter[first]=[];
        byLetter[first].push(c);
    });

    document.getElementById('countText').textContent=cheeses.length+' fromages répertoriés';

    // Letter nav
    var navHtml='';
    var letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    letters.forEach(function(l){
        if(byLetter[l]){
            navHtml+='<a href="#letter-'+l+'">'+l+'</a>';
        }else{
            navHtml+='<a class="empty">'+l+'</a>';
        }
    });
    document.getElementById('letterNav').innerHTML=navHtml;

    function getBadges(c){
        var html='';
        if(c.ao&&(c.ao.da||c.ao.dc_aoc||c.ao.di)){
            if(c.ao.da)html+='<span class="badge badge-aop">AOP</span>';
            else if(c.ao.di)html+='<span class="badge badge-igp">IGP</span>';
            else if(c.ao.dc_aoc)html+='<span class="badge badge-aop">AOC</span>';
        }
        if(c.lb&&c.lb.indexOf('Fermier')>=0)html+='<span class="badge badge-fermier">Fermier</span>';
        return html;
    }

    function renderList(filtered){
        var grouped={};
        filtered.forEach(function(c){
            var first=(c.nm||'?')[0].toUpperCase();
            if(first<'A'||first>'Z')first='#';
            if(!grouped[first])grouped[first]=[];
            grouped[first].push(c);
        });

        var html='';
        letters.forEach(function(l){
            if(!grouped[l])return;
            html+='<div class="letter-group"><h2 id="letter-'+l+'">'+l+'</h2><div class="cheese-list">';
            grouped[l].forEach(function(c){
                var badges=getBadges(c);
                html+='<div class="cheese-item"><a href="/#fromage='+encodeURIComponent(c.nm)+'">'+c.nm+'</a>';
                if(badges)html+='<span class="badges">'+badges+'</span>';
                html+='</div>';
            });
            html+='</div></div>';
        });
        document.getElementById('cheeseList').innerHTML=html;
        document.getElementById('countText').textContent=filtered.length+' fromage'+(filtered.length>1?'s':'')+' répertorié'+(filtered.length>1?'s':'');
    }

    renderList(cheeses);

    document.getElementById('searchBox').addEventListener('input',function(){
        var q=this.value.trim().toLowerCase();
        if(!q){renderList(cheeses);return;}
        var filtered=cheeses.filter(function(c){return (c.nm||'').toLowerCase().indexOf(q)>=0;});
        renderList(filtered);
    });
})();
</script>
